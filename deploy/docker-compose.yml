# Production: Postgres, the web server and the job worker on one machine (deploy/README.md).
#
#   cd ~/squirrel && docker compose up -d
#
# Values come from .env next to this file (see deploy/env.example). The server listens on
# 127.0.0.1:8080 only; `tailscale serve` puts HTTPS in front of it for the tailnet.
name: squirrel

x-squirrel: &squirrel
  image: squirrel:${SQUIRREL_TAG:-latest}
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  volumes:
    - ${SQUIRREL_ROOT:?set SQUIRREL_ROOT in .env}/data:/data
  networks: [squirrel]

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    restart: unless-stopped
    environment:
      # The owner of the database is a superuser, so migrations can create the pgvector extension.
      POSTGRES_USER: squirrel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: squirrel
    volumes:
      - ${SQUIRREL_ROOT}/postgres:/var/lib/postgresql/data
    networks: [squirrel]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U squirrel -d squirrel"]
      interval: 5s
      timeout: 3s
      retries: 30

  server:
    <<: *squirrel
    command: ["serve"]
    environment:
      SQUIRREL_DATABASE_URL: postgres://squirrel:${POSTGRES_PASSWORD}@postgres:5432/squirrel
      SQUIRREL_SETUP_TOKEN: ${SQUIRREL_SETUP_TOKEN:?set SQUIRREL_SETUP_TOKEN in .env}
      # Requests reach the container through Docker's port publishing: trust the address they
      # arrive from (the network's gateway with rootful Docker) for X-Forwarded-For, which
      # tailscale serve sets. Rootless Docker forwards from another address: see deploy/README.md.
      SQUIRREL_TRUSTED_PROXIES: ${SQUIRREL_TRUSTED_PROXIES:-172.30.0.1}
    ports:
      - "127.0.0.1:8080:8080"

  worker:
    <<: *squirrel
    command: ["worker"]
    environment:
      SQUIRREL_DATABASE_URL: postgres://squirrel:${POSTGRES_PASSWORD}@postgres:5432/squirrel

networks:
  squirrel:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
