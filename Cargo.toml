[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["macros", "ws"] }
axum-extra = { version = "0.10", features = ["cookie"] }
axum-test = "17"
base64 = "0.22"
blurhash = { version = "0.2.3", default-features = false }
fast_image_resize = { version = "6.1.0", features = ["image"] }
clap = { version = "4", features = ["derive", "env"] }
half = "2"
http-range-header = "1.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff", "bmp"] }
infer = "0.22"
http-body-util = "0.1"
ipnet = "2"
kamadak-exif = "0.6.2"
libheif-rs = { version = "3.0.0", default-features = false, features = ["v1_17", "image"] }
# Bindings to the system libvips (LGPL-2.1+, linked dynamically): previews rendered on demand.
libvips = "=2.3.0"
mime_guess = "2"
ndarray = "0.17"
# A release candidate: its API moves between rcs, hence the exact pin. The ONNX Runtime
# library itself is loaded at run time (scripts/fetch-onnxruntime.sh), never downloaded by the build.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "ndarray"] }
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_latest", "image_latest", "thread_safe"] }
percent-encoding = "2"
pgvector = { version = "0.4", features = ["sqlx", "halfvec"] }
rand = "0.8"
rust-embed = { version = "8", features = ["mime-guess"] }
rustix = { version = "1", features = ["fs", "process", "thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "migrate", "macros", "json"] }
subtle = "2"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["serde", "serde-well-known", "macros"] }
tokio = { version = "1", features = ["full"] }
# onig (C, oniguruma) off: the pure-Rust fancy-regex runs the CLIP pre-tokenizer.
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "set-header", "timeout"] }
tower_governor = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-normalization = "0.1"
utoipa = { version = "5", features = ["uuid", "time"] }
utoipa-axum = "0.2"
yrs = { version = "0.26", features = ["sync"] }
webp = { version = "0.3.1", default-features = false }
uuid = { version = "1", features = ["v7", "serde"] }

squirrel-core = { path = "crates/squirrel-core" }
squirrel-auth = { path = "crates/squirrel-auth" }
squirrel-db = { path = "crates/squirrel-db" }
squirrel-api = { path = "crates/squirrel-api" }
squirrel-storage = { path = "crates/squirrel-storage" }
squirrel-jobs = { path = "crates/squirrel-jobs" }
squirrel-media = { path = "crates/squirrel-media" }
squirrel-worker = { path = "crates/squirrel-worker" }
squirrel-ml = { path = "crates/squirrel-ml" }
squirrel-sandbox = { path = "crates/squirrel-sandbox" }

# Model files are hashed before every load (hundreds of MB): keep that fast in debug builds too.
[profile.dev.package.sha2]
opt-level = 3
# The built-in image pipeline runs in debug builds too (tests, E2E): unoptimised, one 12 MP
# preview needs more than the sandbox's 10 s of CPU.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.fast_image_resize]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
