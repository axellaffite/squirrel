[package]
name = "squirrel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# HEIC/HEIF/AVIF decoding through the system libheif (>= 1.17).
heic = ["squirrel-media/heic"]
# Lightbox previews through the system libvips (>= 8.15).
vips = ["squirrel-media/vips", "squirrel-sandbox/vips"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
sqlx.workspace = true
squirrel-api.workspace = true
squirrel-auth.workspace = true
squirrel-core.workspace = true
squirrel-db.workspace = true
squirrel-storage.workspace = true
squirrel-jobs.workspace = true
squirrel-media.workspace = true
squirrel-ml.workspace = true
squirrel-sandbox.workspace = true
squirrel-worker.workspace = true
rustix.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
tower-http.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
squirrel-ml = { workspace = true, features = ["test-util"] }
squirrel-media = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
squirrel-storage = { workspace = true, features = ["test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.8"
libc = "0.2.191"
seccompiler = "0.5.0"
