[package]
name = "squirrel-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Exposes `testutil` (fixture generators) to other crates' tests and the fixtures example.
test-util = []
# HEIC/HEIF (and AVIF) decoding through the system libheif (>= 1.17).
heic = ["dep:libheif-rs"]
# Lightbox previews through the system libvips (>= 8.15); without it the built-in pipeline renders them.
vips = ["dep:libvips"]

[dependencies]
blurhash.workspace = true
fast_image_resize.workspace = true
libheif-rs = { workspace = true, optional = true }
libvips = { workspace = true, optional = true }
serde_json.workspace = true
sha2.workspace = true
webp.workspace = true
kamadak-exif.workspace = true
image.workspace = true
pdfium-render.workspace = true
serde.workspace = true
thiserror.workspace = true
time.workspace = true

[[example]]
name = "preview_bench"
required-features = ["vips"]

[[example]]
name = "make_fixtures"
required-features = ["test-util"]

[[example]]
name = "make_heic_source"
required-features = ["test-util"]

[dev-dependencies]
tempfile.workspace = true
