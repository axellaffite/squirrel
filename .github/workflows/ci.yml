name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Full debug info made ~100 test binaries fill the runner's disk (the linker died
  # with SIGBUS). Line tables keep file:line in backtraces at a fraction of the size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # The ML test loads every model at 64 threads. On the runners' CPU that reserves
  # more than the 6 GiB default (bad_alloc while loading); real installs use half
  # the cores. The test prints the child's peak (VmPeak) for reference.
  SQUIRREL_ML_MAX_MEMORY_MB: 12288

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
        env:
          POSTGRES_USER: squirrel
          POSTGRES_PASSWORD: squirrel
          POSTGRES_DB: squirrel_dev
        # Same host port as deploy/docker-compose.dev.yml, so .cargo/config.toml's DATABASE_URL works.
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U squirrel" --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the migration check can diff against the PR base.
          fetch-depth: 0
      - name: Free disk space
        # The runner's preinstalled SDKs (Android, .NET, Haskell, CodeQL) take ~25 GB.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Committed migrations are not modified
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --diff-filter=MDR --name-only "origin/${{ github.base_ref }}...HEAD" -- crates/squirrel-db/migrations)
          if [ -n "$changed" ]; then
            echo "::error::Existing migrations were modified, renamed or deleted; add a new migration instead:"
            echo "$changed"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@1.94
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # PDF tests need pdfium; with CI set they fail rather than skip when it is missing.
      # Outside target/: rust-cache restores target/ with unknown files pruned,
      # which left a half pdfium that the script (rightly) refused to overwrite.
      - name: Fetch pdfium
        run: |
          set -o pipefail
          scripts/fetch-pdfium.sh "$PWD/.cache/squirrel-assets/pdfium" | tail -n 1 >> "$GITHUB_ENV"
      # ML tests need ONNX Runtime and the models (~650 MB); with CI set they fail rather than skip.
      # Separate caches, keyed by each pin list; outside target/ so rust-cache does not store them too.
      # The scripts verify every hash on a cache hit and only download what is missing or wrong.
      - name: Cache ONNX Runtime
        uses: actions/cache@v4
        with:
          path: .cache/squirrel-assets/onnxruntime
          key: onnxruntime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-onnxruntime.sh') }}
          restore-keys: onnxruntime-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache the models
        uses: actions/cache@v4
        with:
          path: .cache/squirrel-assets/models
          key: models-${{ hashFiles('scripts/fetch-models.sh') }}
          restore-keys: models-
      - name: Fetch ONNX Runtime and models
        run: |
          set -o pipefail
          scripts/fetch-onnxruntime.sh | tail -n 1 >> "$GITHUB_ENV"
          scripts/fetch-models.sh | tail -n 1 >> "$GITHUB_ENV"
      - run: cargo test --workspace
      - name: The Linux-only sandbox memory limit test is part of the suite
        run: |
          cargo test -p squirrel --test media_exec -- --list 2>/dev/null \
            | grep -q '^the_memory_limit_stops_a_large_decode: test$' \
            || { echo "::error::the RLIMIT_AS test did not compile into the suite"; exit 1; }
          cargo test -p squirrel --test ml_exec -- --list 2>/dev/null \
            | grep -q '^the_child_runs_under_its_address_space_limit: test$' \
            || { echo "::error::the ml-exec RLIMIT_AS test did not compile into the suite"; exit 1; }

  rust-heic:
    # HEIC/HEIF decoding through the system libheif (>= 1.17, with the libde265 HEVC plugin).
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
        env:
          POSTGRES_USER: squirrel
          POSTGRES_PASSWORD: squirrel
          POSTGRES_DB: squirrel_dev
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U squirrel" --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        # The runner's preinstalled SDKs (Android, .NET, Haskell, CodeQL) take ~25 GB.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install libheif
        run: |
          sudo apt-get update
          # libde265 decodes HEVC; heif-enc (libheif-examples) with x265 encodes the test fixture.
          sudo apt-get install -y libheif-dev libheif-plugin-libde265 libheif-examples libheif-plugin-x265
      - name: Encode the HEIC test fixture
        run: |
          heif-enc -q 50 -o crates/squirrel-media/tests/fixtures/rotated.heic \
            crates/squirrel-media/tests/fixtures/rotated-source.jpg
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
        with:
          key: heic
      - name: Fetch pdfium
        run: |
          set -o pipefail
          scripts/fetch-pdfium.sh "$PWD/.cache/squirrel-assets/pdfium" | tail -n 1 >> "$GITHUB_ENV"
      # ML tests need ONNX Runtime and the models (~650 MB); with CI set they fail rather than skip.
      # Separate caches, keyed by each pin list; outside target/ so rust-cache does not store them too.
      # The scripts verify every hash on a cache hit and only download what is missing or wrong.
      - name: Cache ONNX Runtime
        uses: actions/cache@v4
        with:
          path: .cache/squirrel-assets/onnxruntime
          key: onnxruntime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-onnxruntime.sh') }}
          restore-keys: onnxruntime-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache the models
        uses: actions/cache@v4
        with:
          path: .cache/squirrel-assets/models
          key: models-${{ hashFiles('scripts/fetch-models.sh') }}
          restore-keys: models-
      - name: Fetch ONNX Runtime and models
        run: |
          set -o pipefail
          scripts/fetch-onnxruntime.sh | tail -n 1 >> "$GITHUB_ENV"
          scripts/fetch-models.sh | tail -n 1 >> "$GITHUB_ENV"
      - run: cargo test -p squirrel-media -p squirrel-worker --features squirrel-media/heic
      # The sandboxed path: `squirrel media-exec` registers the HEIC decoder in the child.
      - run: cargo test -p squirrel --features squirrel/heic

  rust-vips:
    # Previews through the system libvips (feature `vips`; the Docker image builds with it).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
        env:
          POSTGRES_USER: squirrel
          POSTGRES_PASSWORD: squirrel
          POSTGRES_DB: squirrel_dev
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U squirrel" --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install libvips
        run: |
          sudo apt-get update
          # The HEIF loader is a libvips module; heif-enc (with x265) encodes the test fixture.
          sudo apt-get install -y --no-install-recommends libvips-dev libvips-tools pkg-config \
            libheif-plugin-libde265 libheif-examples libheif-plugin-x265
          vips --version
          vips --vips-config | grep -i heif
      - name: Encode the HEIC test fixture
        run: |
          heif-enc -q 50 -o crates/squirrel-media/tests/fixtures/rotated.heic \
            crates/squirrel-media/tests/fixtures/rotated-source.jpg
      - uses: dtolnay/rust-toolchain@1.94
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: vips
      - run: cargo clippy -p squirrel -p squirrel-media -p squirrel-sandbox --features squirrel/vips --all-targets -- -D warnings
      # The PDF tests of these crates need pdfium (with CI set they fail rather than skip).
      - name: Fetch pdfium
        run: |
          set -o pipefail
          scripts/fetch-pdfium.sh "$PWD/.cache/squirrel-assets/pdfium" | tail -n 1 >> "$GITHUB_ENV"
      # libvips in-process: every orientation against the built-in pipeline, limits, fallbacks, HEIF.
      - run: cargo test -p squirrel-media -p squirrel-sandbox --features squirrel-media/vips,squirrel-sandbox/vips
      # libvips in the sandbox child, under the preview limits (RLIMIT_AS 1.5 GiB, MALLOC_ARENA_MAX=2).
      - run: cargo test -p squirrel --features squirrel/vips --test media_exec
      - name: The child's probe finds libvips and its loaders
        run: |
          report=$(cargo run -q -p squirrel --features squirrel/vips -- media-exec --probe)
          echo "$report"
          echo "$report" | grep -q '"heifload"' || { echo "::error::libvips without its HEIF loader"; exit 1; }
      # The API's previews rendered by libvips (in-process in tests).
      - run: cargo test -p squirrel-api --features squirrel-media/vips --test previews

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API client matches openapi.json
        run: pnpm gen:api && git diff --exit-code src/lib/api/schema.d.ts
      - run: pnpm check
      - run: pnpm test:unit
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
        env:
          POSTGRES_USER: squirrel
          POSTGRES_PASSWORD: squirrel
          POSTGRES_DB: squirrel
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U squirrel" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      # Makes scripts/e2e-server.sh skip docker compose and recreate this database with psql.
      SQUIRREL_E2E_DATABASE_URL: postgres://squirrel:squirrel@localhost:55432/squirrel_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Build the server before Playwright starts it
        run: cargo build -p squirrel
      # The documents scenario checks PDF thumbnails and text (it skips them without pdfium).
      - name: Fetch pdfium
        run: |
          set -o pipefail
          scripts/fetch-pdfium.sh "$PWD/.cache/squirrel-assets/pdfium" | tail -n 1 >> "$GITHUB_ENV"
      # The search, people and Explore scenarios run the real models (with CI set they fail
      # rather than skip). Same caches as the rust job: one download per pin change.
      - name: Cache ONNX Runtime
        uses: actions/cache@v4
        with:
          path: .cache/squirrel-assets/onnxruntime
          key: onnxruntime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-onnxruntime.sh') }}
          restore-keys: onnxruntime-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache the models
        uses: actions/cache@v4
        with:
          path: .cache/squirrel-assets/models
          key: models-${{ hashFiles('scripts/fetch-models.sh') }}
          restore-keys: models-
      - name: Fetch ONNX Runtime and models
        run: |
          set -o pipefail
          scripts/fetch-onnxruntime.sh | tail -n 1 >> "$GITHUB_ENV"
          scripts/fetch-models.sh | tail -n 1 >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm test:e2e
        working-directory: web
        env:
          # Fresh data directory for scripts/e2e-server.sh (it must be named e2e-data).
          # Step-level: the runner context is not available in job-level env.
          SQUIRREL_E2E_DATA_DIR: ${{ runner.temp }}/e2e-data
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  # Phone apps (Phase 6). Slow jobs (about 10 min Android, 20 min iOS), so they run only when
  # something they build from changed: the app, the API contract or the design tokens.
  mobile-changes:
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mobile:
              - 'mobile/**'
              - 'openapi.json'
              - 'web/src/lib/styles/tokens.css'
              - 'web/scripts/native-*.mjs'
              - '.github/workflows/ci.yml'

  mobile-android:
    needs: mobile-changes
    if: needs.mobile-changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      # The same JDK as the Gradle toolchain (libs.versions.toml `jvm-toolchain`); auto-download is off.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK platform 37 (compileSdk)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
      # The native theme is generated from web/src/lib/styles/tokens.css: no drift allowed.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Native tokens and icons match tokens.css
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm check:native-tokens
      - name: Generated API client matches openapi.json
        run: ./gradlew :shared:checkApiClient
      - run: ./gradlew :shared:jvmTest :theme:jvmTest :ui:jvmTest :androidApp:testDebugUnitTest
      - run: ./gradlew :androidApp:lintDebug :androidApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: squirrel-debug-apk
          path: mobile/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-reports
          path: |
            mobile/*/build/reports
          retention-days: 7

  mobile-ios:
    needs: mobile-changes
    if: needs.mobile-changes.outputs.mobile == 'true'
    # Kotlin 2.4.21 officially supports Xcode 26.4; the app is developed with Xcode 27 locally.
    # Which Xcode versions the hosted images carry is not verified here (CI has never run): if
    # Xcode_26.4 is missing, pick the newest 26.x the image lists under /Applications.
    runs-on: macos-26
    env:
      XCODE_APP: /Applications/Xcode_26.4.app
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin/Native tests on the iOS simulator
        run: ./gradlew -Psquirrel.ios=true :shared:iosSimulatorArm64Test :ui:iosSimulatorArm64Test
      # XCTests run headless on a simulator. Without photo access the PhotoKit tests skip, and
      # without SQUIRREL_SERVER the end-to-end test skips; the Keychain, transport and launch tests run.
      - name: XCTests on a simulator
        run: |
          udid=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in d if "iOS" in r for x in d[r] if x["name"].startswith("iPhone")))')
          xcodebuild test -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -destination "platform=iOS Simulator,id=$udid"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-reports
          path: |
            mobile/*/build/reports
            ~/Library/Developer/Xcode/DerivedData/*/Logs/Test
          retention-days: 7
